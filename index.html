<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#040607">
  <title>6 Months</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="chatIntro" class="chat-screen">
  <div class="chat-background"></div>
  <div class="chat-vignette"></div>

  <header class="chat-header">
    <button class="icon-btn back-btn" aria-label="Back">←</button>
    <div class="profile-avatar">
      <img src="avatar.jpg" alt="" onerror="this.remove()">
      <span>♡</span>
    </div>
    <div class="profile-info">
      <div class="profile-name">Slečna Kačenka</div>
      <div class="profile-status">Active now</div>
    </div>
    <button class="icon-btn call-btn" aria-label="Call">⌕</button>
    <button class="icon-btn video-btn" aria-label="Video">▢</button>
  </header>

  <main id="chatBody" class="chat-body">
    <div class="date-separator">7. NOV., 16:10</div>
    <div class="story-context">
      <div>You replied to their story</div>
      <div>Story unavailable</div>
    </div>
    <div id="messages" class="messages"></div>
    <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>
  </main>

  <form id="messageForm" class="composer" autocomplete="off">
    <button type="button" class="camera-btn" aria-label="Camera"><span class="camera-lens"></span></button>
    <input id="messageInput" type="text" placeholder="Message..." maxlength="250">
    <button type="button" class="composer-icon">◌</button>
    <button type="button" class="composer-icon">▧</button>
    <button type="button" class="composer-icon">☺</button>
    <button type="submit" id="sendButton" class="send-btn">Send</button>
  </form>
</section>


<section id="chatInterlude" class="chat-screen hidden-screen">
  <div class="chat-background"></div>
  <div class="chat-vignette"></div>

  <header class="chat-header">
    <button class="icon-btn back-btn" aria-label="Back">←</button>
    <div class="profile-avatar">
      <img src="avatar.jpg" alt="" onerror="this.remove()">
      <span>♡</span>
    </div>
    <div class="profile-info">
      <div class="profile-name">Slečna Kačenka</div>
      <div class="profile-status">Active now</div>
    </div>
    <button class="icon-btn call-btn" aria-label="Call">⌕</button>
    <button class="icon-btn video-btn" aria-label="Video">▢</button>
  </header>

  <main id="chatInterludeBody" class="chat-body">
    <div id="interludeMessages" class="messages"></div>
    <div id="interludeTyping" class="typing hidden"><span></span><span></span><span></span></div>
  </main>

  <form id="interludeForm" class="composer" autocomplete="off">
    <button type="button" class="camera-btn" aria-label="Camera"><span class="camera-lens"></span></button>
    <input id="interludeInput" type="text" placeholder="Message..." maxlength="250">
    <button type="button" class="composer-icon">◌</button>
    <button type="button" class="composer-icon">▧</button>
    <button type="button" class="composer-icon">☺</button>
    <button type="submit" id="interludeSendButton" class="send-btn">Send</button>
  </form>
</section>

<section id="treeHub" class="tree-screen hidden-screen">
  <canvas id="treeCanvas" class="well-canvas" aria-hidden="true"></canvas>
  <div class="tree-green-vignette"></div>
  <div class="tree-scanlines"></div>
  <div class="tree-haze tree-haze-a"></div>
  <div class="tree-haze tree-haze-b"></div>

  <header class="tree-header">
    <button id="soundToggleTree" class="sound-toggle" type="button">SOUND ON</button>
  </header>

  <div class="tree-stage">
    <img class="tree-image" src="tree.png" alt="Green pixel tree">

    <button class="bush bush-1" data-memory="01" aria-label="Memory 01"><span>01</span></button>
    <button class="bush bush-2" data-memory="02" aria-label="Memory 02"><span>02</span></button>
    <button class="bush bush-3" data-memory="03" aria-label="Memory 03"><span>03</span></button>
    <button class="bush bush-4" data-memory="04" aria-label="Memory 04"><span>04</span></button>
  </div>

  <button id="enterWellFromTree" class="tree-enter-well hidden" type="button">ENTER MEMORY WELL</button>
</section>

<section id="treeMemoryPage" class="tree-memory-page hidden-screen">
  <canvas id="treeMemoryCanvas" class="well-canvas" aria-hidden="true"></canvas>
  <div class="tree-green-vignette"></div>
  <div class="tree-scanlines"></div>
  <div class="tree-haze tree-haze-a"></div>
  <div class="tree-haze tree-haze-b"></div>

  <div class="tree-memory-topbar">
    <button id="backToTree" class="back-orbit" type="button">← MAIN SCREEN</button>
    <button id="soundToggleTreeMemory" class="sound-toggle" type="button">SOUND ON</button>
  </div>

  <main class="tree-memory-main">
    <div id="treeMemoryIndex" class="tree-memory-index">01</div>
    <div class="tree-memory-grid">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </main>
</section>

<section id="orbitScreen" class="orbit-screen hidden-screen">
  <canvas id="wellCanvas" class="well-canvas" aria-hidden="true"></canvas>
  <canvas id="trailCanvas" class="trail-canvas" aria-hidden="true"></canvas>

  <div class="screen-vignette"></div>
  <div class="scanlines"></div>
  <div class="chromatic-haze haze-a"></div>
  <div class="chromatic-haze haze-b"></div>
  <div class="cursor-light" id="cursorLight"></div>

  <div class="cave-frame cave-left"></div>
  <div class="cave-frame cave-right"></div>
  <div class="glitch-band g1"></div>
  <div class="glitch-band g2"></div>

  <div class="ascii-field" aria-hidden="true"><pre>
░▒▓█  ·  ◌  .  ✦  .  ◌  ·  █▓▒░
[]{}//\  010101  //\{}[]
</pre></div>

  <header class="orbit-header">
    <button id="soundToggle" class="sound-toggle" type="button">SOUND ON</button>
  </header>

  <div class="title-wrap">
    <h1 id="orbitTitle" class="orbit-title" data-text="6 MONTHS">6 MONTHS</h1>
  </div>

  <div class="pixel-water" aria-hidden="true">
    <div class="water-line w1"></div>
    <div class="water-line w2"></div>
    <div class="water-line w3"></div>
  </div>

  <div id="orbitStage" class="orbit-stage">
    <button class="sphere sphere-april" data-month="april"><span class="orb-no">01</span><span class="sphere-label">APRIL</span></button>
    <button class="sphere sphere-may" data-month="may"><span class="orb-no">02</span><span class="sphere-label">MAY</span></button>
    <button class="sphere sphere-june" data-month="june"><span class="orb-no">03</span><span class="sphere-label">JUNE</span></button>
    <button class="sphere sphere-july" data-month="july"><span class="orb-no">04</span><span class="sphere-label">JULY</span></button>
    <button class="sphere sphere-august" data-month="august"><span class="orb-no">05</span><span class="sphere-label">AUGUST</span></button>
    <button class="sphere sphere-september" data-month="september"><span class="orb-no">06</span><span class="sphere-label">SEPTEMBER</span></button>
  </div>
</section>

<section id="monthPage" class="month-page hidden-screen">
  <canvas id="monthCanvas" class="well-canvas" aria-hidden="true"></canvas>
  <div class="screen-vignette"></div>
  <div class="scanlines"></div>
  <div class="chromatic-haze haze-a"></div>
  <div class="chromatic-haze haze-b"></div>

  <div class="month-topbar">
    <button id="backToOrbit" class="back-orbit" type="button">← MAIN SCREEN</button>
    <button id="soundToggleMonth" class="sound-toggle" type="button">SOUND ON</button>
  </div>

  <div class="month-layout">
    <aside class="month-sidebar">
      <div id="monthIndex" class="month-index">01</div>
      <div class="month-range">APRIL → SEPTEMBER</div>
      <div class="tiny-map" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </aside>

    <main class="month-main">
      <h2 id="monthTitle" class="month-title" data-text="APRIL">APRIL</h2>

      <div class="month-photo-grid">
        <div class="month-photo photo-a" aria-hidden="true"></div>
        <div class="month-photo photo-b" aria-hidden="true"></div>
        <div class="month-photo photo-c" aria-hidden="true"></div>
      </div>
    </main>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
